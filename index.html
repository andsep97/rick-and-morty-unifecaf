<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty | Personagens</title>
    <link rel="stylesheet" href="rick-and-morty.css">
</head>
<body>
    <!-- HEADER COM TÍTULO -->
    <header>
        <h1>Rick and Morty</h1>

    <main>

            <h2>Bem-vindo ao universo de Rick and Morty!</h2>

    <!-- FOOTER -->
    <footer>
        <p>Projeto desenvolvido para a disciplina de Web Programming for Front End - UniFECAF</p>
